minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

peerDependencyRules:
  allowAny:
    - vite

shellEmulator: true

packages:
  - apps/*
  - packages/*

overrides:
  typescript@*: 'catalog:toolchain'
  vite@*: 'catalog:toolchain'
  vitest@*: 'catalog:test'

allowBuilds:
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

catalogs:
  runtime:
    '@nuxt/content': ^3.16.2
    '@nuxt/image': 2.2.1
    '@nuxt/ui': 4.12.0
    '@nuxtjs/i18n': ^10.6.0
    '@nuxtjs/seo': ^3.4.0
    '@vueuse/nuxt': 15.0.0
    nuxt: 4.6.1
    nuxt-og-image: ^6.10.4
    nuxt-studio: ^1.8.1
    vue-router: ^5.5.0
  test:
    '@nuxt/test-utils': 4.4.0
    '@playwright/test': 1.65.0
    '@vue/test-utils': 2.5.1
    happy-dom: ^21.0.4
    playwright-core: 1.65.0
    # Must match the Vitest bundled by `vite-plus`. `@nuxt/test-utils` needs the upstream package.
    vitest: 5.1.0
    vitest-fail-on-console: ^0.10.1
  # Build, lint, and type-check the source code.
  toolchain:
    '@compodium/nuxt': 0.1.0-beta.14
    '@iconify-json/lucide': ^1.2.154
    '@iconify-json/simple-icons': ^1.2.102
    '@nustackjs/lint': 0.5.0
    '@nuxt/devtools': ^3.4.4
    '@types/three': 0.187.0
    eslint: ^10.14.0
    tailwindcss: ^4.3.5
    # `vue-tsc` needs the JavaScript TypeScript API, which TypeScript 7 does not ship yet.
    typescript: ^6.0.3
    # Keep Vite Plus and its core on the same version.
    vite: npm:@voidzero-dev/vite-plus-core@1.6.0
    vite-plus: 1.6.0
    vue-tsc: ^3.3.14
